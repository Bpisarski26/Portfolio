<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
    <style>
       
       @keyframes twinkle {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.1; }
}
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            text-align: center;
            background-color: black;
            position: relative;
            z-index: 1;
            
        }
        input {
        margin: 10px;
        padding: 10px;
        background-color: #000000;
        color: rgb(255, 255, 255);
        border: 1px solid rgb(0, 248, 120);
        border-radius: 200px;
        font-size: 15px;
        font-style: italic;
        outline: 2px solid rgb(0, 248, 120);
        position: relative;
        z-index: 1;
        background-color: black;
    
}
        input::placeholder {
            color: rgb(100, 100, 100);
        }
        button {
            padding: 5px 10px;
            background-color: #007bff;
            color: rgb(255, 255, 255);
            border: none;
            cursor: pointer;
            border-radius: 30px;
            position: relative;
            z-index: 1;
            
        }
        button:hover {
            background-color: #00ff80;
            color: rgb(255, 255, 255);
        }
        #result {
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            color: rgb(0, 248, 120)
        }
        h1 {
            color: rgb(255, 255, 255);
            text-align: center;
        }

        .tips-btn {
            padding: 5px 10px;
            background-color: #007bff;
            color: rgb(255, 255, 255);
            border: none;
            cursor: pointer;
            border-radius: 30px;
            position: relative;
            z-index: 1;
            text-decoration: none;
            
            
        }
        .tips-btn:hover {
            background-color: #00ff80;
            color: rgb(255, 255, 255);
        }
    </style>
</head>
<body>
    <h1>Add your scores. Let's see how you did!</h1>
    <input type="number" id="score1" placeholder="Enter score 1">
    <input type="number" id="score2" placeholder="Enter score 2">
    <input type="number" id="score3" placeholder="Enter score 3">
    <button id="reset">Reset</button>
    <button id="calculate">Calculate</button>
    <a href="helpfultips.html" class="tips-btn">Helpful Tips</a>
    <p id=result></p>
    
    <script src="script.js"></script>
</body>
</html>

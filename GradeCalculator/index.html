<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
    <link rel="stylesheet" href="GradeCalculator.css">
</head>
<body>
    <h1>Add your scores. Let's see how you did!</h1>
    <input type="number" id="score1" placeholder="Enter score 1">
    <input type="number" id="score2" placeholder="Enter score 2">
    <input type="number" id="score3" placeholder="Enter score 3">
    <button id="reset">Reset</button>
    <button id="calculate">Calculate</button>
    <p id=result></p>
    <script src="script.js"></script>
</body>
</html>
